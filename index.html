const start = new Date(2026, 9, 2);

const diffDays = Math.max(0, Math.floor((now - start) / 86400000));
document.getElementById("daysNumber").textContent = diffDays;
document.getElementById("memorial").textContent = diffDays === 0 ? "今天是第一次做网站的日子" : "第一次做网站，已经过去了 " + diffDays + " 天";
document.getElementById("card").addEventListener("click", () => document.getElementById("card").classList.toggle("flipped"));

const navButtons = [...document.querySelectorAll(".nav-button")];
const pagePanels = {
  home: document.getElementById("homePanel"),
  records: document.getElementById("recordsPanel"),
  inbox: document.getElementById("inboxPanel")
};
const inboxSection = document.getElementById("inboxSection");
function showPage(page) {
  Object.entries(pagePanels).forEach(([key, panel]) => { panel.hidden = key !== page; });
  navButtons.forEach(button => button.classList.toggle("active", button.dataset.page === page));
  window.scrollTo({ top: 0, behavior: "smooth" });
}
const sidebarNav = document.getElementById("sidebarNav");
const sidebarToggle = document.getElementById("sidebarToggle");
function setSidebarOpen(open) {
  sidebarNav.classList.toggle("expanded", open);
  sidebarToggle.setAttribute("aria-expanded", String(open));
  sidebarToggle.setAttribute("aria-label", open ? "收起导航" : "打开导航");
  sidebarToggle.title = open ? "收起导航" : "打开导航";
}
sidebarToggle.addEventListener("click", () => setSidebarOpen(!sidebarNav.classList.contains("expanded")));
navButtons.forEach(button => button.addEventListener("click", () => {
  showPage(button.dataset.page);
  setSidebarOpen(false);
}));

const authCard = document.getElementById("authCard");
const privateArea = document.getElementById("privateArea");
const authStatus = document.getElementById("authStatus");
const privateStatus = document.getElementById("privateStatus");
const recordList = document.getElementById("recordList");
const threadList = document.getElementById("threadList");
const inboxStatus = document.getElementById("inboxStatus");
const chatPanel = document.getElementById("chatPanel");
const chatTitle = document.getElementById("chatTitle");
const messageList = document.getElementById("messageList");
const messageStatus = document.getElementById("messageStatus");
let supabaseClient = null;
let currentUser = null;
let currentThread = null;

function setLoggedOut(message) {
  currentUser = null;
  currentThread = null;
  authCard.hidden = false;
  privateArea.hidden = true;
  inboxSection.hidden = true;
  recordList.replaceChildren();
  threadList.replaceChildren();
  messageList.replaceChildren();
  chatPanel.hidden = true;
  threadList.hidden = false;
  inboxStatus.hidden = false;
  if (message) authStatus.textContent = message;
}
function formatDate(value) {
  if (!value) return "";
  const parts = value.split("-");
  return parts.length === 3 ? parts.join(" · ") : value;
}
function addTextElement(parent, className, value) {
  const element = document.createElement("div");
  element.className = className;
  element.textContent = value ?? "";
  parent.appendChild(element);
  return element;
}

async function loadRecordComments(recordId, container) {
  const section = document.createElement("div");
  section.className = "record-comments";
  const heading = document.createElement("div");
  heading.className = "comment-title";
  heading.textContent = "记录下的留言";
  section.appendChild(heading);

  const { data, error } = await supabaseClient
    .from("record_comments")
    .select("id, sender, text, created_at")
    .eq("record_id", recordId)
    .eq("user_id", currentUser.id)
    .order("created_at", { ascending: true });

  if (error) {
    const err = document.createElement("div");
    err.className = "status";
    err.textContent = "留言读取失败：" + error.message;
    section.appendChild(err);
  } else if (data && data.length) {
    data.forEach(item => {
      const comment = document.createElement("div");
      comment.className = "comment-item";
      const author = document.createElement("div");
      author.className = "comment-author";
      author.textContent = item.sender === "kk" ? "KK" : "我";
      const text = document.createElement("div");
      text.textContent = item.text;
      comment.append(author, text);
      section.appendChild(comment);
    });
  } else {
    const empty = document.createElement("div");
    empty.className = "status";
    empty.textContent = "还没有留言。";
    section.appendChild(empty);
  }

  const form = document.createElement("form");
  form.className = "comment-form";
  const textarea = document.createElement("textarea");
  textarea.rows = 2;
  textarea.maxLength = 2000;
  textarea.placeholder = "给这条记录补充一句话……";
  textarea.required = true;
  const submit = document.createElement("button");
  submit.className = "action-button";
  submit.type = "submit";
  submit.textContent = "添加留言";
  form.append(textarea, submit);
  form.addEventListener("submit", async event => {
    event.preventDefault();
    const text = textarea.value.trim();
    if (!text || !currentUser) return;
    submit.disabled = true;
    const { error } = await supabaseClient.from("record_comments").insert({
      record_id: recordId,
      user_id: currentUser.id,
      sender: "you",
      text
    });
    submit.disabled = false;
    if (error) {
      alert("留言保存失败：" + error.message);
      return;
    }
    await loadRecords();
  });
  section.appendChild(form);
  container.appendChild(section);
}

async function loadRecords() {
  if (!currentUser) return;
  privateStatus.textContent = "正在读取你的记录……";
  recordList.replaceChildren();
  const { data, error } = await supabaseClient.from("website_records")
    .select("id, record_date, text")
    .eq("user_id", currentUser.id)
    .order("created_at", { ascending: false });
  if (error) {
    privateStatus.textContent = "读取失败：" + error.message;
    return;
  }
  if (!data || data.length === 0) {
    privateStatus.textContent = "这里还没有记录，可以添加第一条。";
    return;
  }
  privateStatus.textContent = "这些记录只有你登录后才能查看。";
  for (const record of data) {
    const card = document.createElement("div");
    card.className = "record";
    addTextElement(card, "record-date", formatDate(record.record_date));
    addTextElement(card, "record-text", record.text);
    const actions = document.createElement("div");
    actions.style.textAlign = "right";
    const editButton = document.createElement("button");
    editButton.className = "action-button";
    editButton.type = "button";
    editButton.textContent = "修改";
    editButton.addEventListener("click", async () => {
      const updatedText = prompt("修改这条成长记录：", record.text);
      if (updatedText === null || !updatedText.trim()) return;
      const { error } = await supabaseClient.from("website_records")
        .update({ text: updatedText.trim() }).eq("id", record.id).eq("user_id", currentUser.id);
      if (error) alert("修改失败：" + error.message); else await loadRecords();
    });
    const deleteButton = document.createElement("button");
    deleteButton.className = "action-button";
    deleteButton.type = "button";
    deleteButton.textContent = "删除";
    deleteButton.addEventListener("click", async () => {
      if (!confirm("确定删除这条成长记录吗？")) return;
      const { error } = await supabaseClient.from("website_records")
        .delete().eq("id", record.id).eq("user_id", currentUser.id);
      if (error) alert("删除失败：" + error.message); else await loadRecords();
    });
    actions.append(editButton, deleteButton);
    card.appendChild(actions);
    recordList.appendChild(card);
    await loadRecordComments(record.id, card);
  }
}

async function loadThreads() {
  if (!currentUser) return;
  inboxStatus.textContent = "正在打开信箱……";
  threadList.replaceChildren();
  const { data, error } = await supabaseClient.from("inbox_threads")
    .select("id, title, updated_at, created_at")
    .eq("user_id", currentUser.id)
    .order("updated_at", { ascending: false });
  if (error) {
    inboxStatus.textContent = "读取信箱失败：" + error.message;
    return;
  }
  if (!data || data.length === 0) {
    inboxStatus.textContent = "信箱还是空的，可以写下第一封信。";
    return;
  }
  inboxStatus.textContent = "点开一封信，就能进入对应的话题。";
  data.forEach(thread => {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "thread-card";
    const title = document.createElement("strong");
    title.textContent = thread.title;
    const meta = document.createElement("small");
    meta.textContent = "打开这封信";
    button.append(title, meta);
    button.addEventListener("click", () => openThread(thread));
    threadList.appendChild(button);
  });
}
async function openThread(thread) {
  currentThread = thread;
  chatTitle.textContent = thread.title;
  chatPanel.hidden = false;
  threadList.hidden = true;
  inboxStatus.hidden = true;
  await loadMessages();
}
async function loadMessages() {
  if (!currentUser || !currentThread) return;
  messageList.replaceChildren();
  messageStatus.textContent = "正在读取消息……";
  const { data, error } = await supabaseClient.from("inbox_messages")
    .select("id, sender, text, created_at")
    .eq("thread_id", currentThread.id)
    .eq("user_id", currentUser.id)
    .order("created_at", { ascending: true });
  if (error) {
    messageStatus.textContent = "读取消息失败：" + error.message;
    return;
  }
  if (!data || data.length === 0) {
    messageStatus.textContent = "这封信还没有消息。";
    return;
  }
  data.forEach(item => {
    const bubble = document.createElement("div");
    bubble.className = "message " + (item.sender === "kk" ? "message-kk" : "message-you");
    const meta = document.createElement("div");
    meta.className = "message-meta";
    meta.textContent = item.sender === "kk" ? "KK" : "我";
    const content = document.createElement("div");
    content.textContent = item.text;
    bubble.append(meta, content);
    messageList.appendChild(bubble);
  });
  messageStatus.textContent = "";
  messageList.scrollTop = messageList.scrollHeight;
}
document.getElementById("createThreadButton").addEventListener("click", async () => {
  if (!currentUser) return;
  const input = document.getElementById("threadTitle");
  const title = input.value.trim();
  if (!title) {
    inboxStatus.textContent = "先给这封信起个标题吧。";
    return;
  }
  inboxStatus.textContent = "正在创建……";
  const { data, error } = await supabaseClient.from("inbox_threads")
    .insert({ user_id: currentUser.id, title })
    .select("id, title, updated_at, created_at").single();
  if (error) {
    inboxStatus.textContent = "创建失败：" + error.message;
    return;
  }
  input.value = "";
  await loadThreads();
  await openThread(data);
});
document.getElementById("messageForm").addEventListener("submit", async event => {
  event.preventDefault();
  if (!currentUser || !currentThread) return;
  const input = document.getElementById("messageText");
  const text = input.value.trim();
  if (!text) return;
  messageStatus.textContent = "正在发送……";
  const { error } = await supabaseClient.from("inbox_messages").insert({
    thread_id: currentThread.id,
    user_id: currentUser.id,
    sender: "you",
    text
  });
  if (error) {
    messageStatus.textContent = "发送失败：" + error.message;
    return;
  }
  input.value = "";
  await loadMessages();
});
document.getElementById("backToInboxButton").addEventListener("click", async () => {
  currentThread = null;
  chatPanel.hidden = true;
  threadList.hidden = false;
  inboxStatus.hidden = false;
  await loadThreads();
});

async function showSignedInUser(user) {
  currentUser = user;
  authCard.hidden = true;
  privateArea.hidden = false;
  inboxSection.hidden = false;
  await loadRecords();
  await loadThreads();
}
document.getElementById("loginForm").addEventListener("submit", async event => {
  event.preventDefault();
  if (!supabaseClient) {
    authStatus.textContent = "Supabase 配置不正确，请检查 Project URL 和 Publishable key。";
    return;
  }
  authStatus.textContent = "正在登录……";
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
  if (error) {
    authStatus.textContent = "登录失败，请检查邮箱和密码。详细信息：" + error.message;
    return;
  }
  await showSignedInUser(data.user);
});
document.getElementById("addButton").addEventListener("click", async () => {
  if (!currentUser) return;
  const text = prompt("今天做了什么？");
  if (text === null || !text.trim()) return;
  const d = new Date();
  const dateText = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  const { error } = await supabaseClient.from("website_records").insert({
    record_date: dateText, text: text.trim(), user_id: currentUser.id
  });
  if (error) alert("保存失败：" + error.message); else await loadRecords();
});
document.getElementById("logoutButton").addEventListener("click", async () => {
  const { error } = await supabaseClient.auth.signOut();
  if (error) {
    alert("退出登录失败：" + error.message);
    return;
  }
  setLoggedOut("你已退出登录。成长记录已隐藏。");
});
async function initialize() {
  if (!window.supabase || !SUPABASE_URL || !SUPABASE_PUBLISHABLE_KEY) {
    authStatus.textContent = "Supabase 配置缺失，请检查 Project URL 和 Publishable key。";
    return;
  }
  try {
    supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
    const { data, error } = await supabaseClient.auth.getSession();
    if (error) throw error;
    if (data.session?.user) await showSignedInUser(data.session.user);
  } catch (error) {
    authStatus.textContent = "初始化失败，请检查网络和 Supabase 配置。";
  }
}
setLoggedOut();
initialize();
</script>
</body>
</html>
