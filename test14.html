<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>我的网站成长记录</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      font-family:
        "Microsoft YaHei",
        "PingFang SC",
        sans-serif;

      color: #5c4636;

      background-color: #e8dccb;

      background-image:
        repeating-linear-gradient(
          92deg,
          rgba(120, 90, 60, 0.025) 0px,
          rgba(120, 90, 60, 0.025) 1px,
          transparent 1px,
          transparent 80px
        ),
        repeating-linear-gradient(
          4deg,
          rgba(255, 255, 255, 0.18) 0px,
          rgba(255, 255, 255, 0.18) 2px,
          transparent 2px,
          transparent 110px
        );
    }


    .container {
      width: 90%;
      max-width: 650px;

      margin: 0 auto;

      padding: 70px 0;

      text-align: center;
    }


    /* ===== 叶子 ===== */

    .leaf {
      width: 42px;
      height: 42px;

      margin: 0 auto 12px;

      opacity: 0.72;
    }

    .leaf svg {
      width: 100%;
      height: 100%;
    }

    .leaf path {
      fill: none;
      stroke: #806b57;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }


    /* ===== 标题 ===== */

    h1 {
      margin: 0;

      color: #5c4636;

      font-size: 44px;
      font-weight: 400;

      letter-spacing: 10px;
    }


    .date {
      margin-top: 12px;

      color: #927d68;

      font-size: 13px;

      letter-spacing: 3px;
    }


    /* ===== 第一张翻转卡片 ===== */

    .card {
      width: 100%;
      max-width: 580px;

      height: 230px;

      margin: 42px auto 0;

      perspective: 1000px;

      cursor: pointer;
    }


    .card-inner {
      position: relative;

      width: 100%;
      height: 100%;

      transition: transform 0.7s ease;

      transform-style: preserve-3d;
    }


    .card.flipped .card-inner {
      transform: rotateY(180deg);
    }


    .card-front,
    .card-back {

      position: absolute;

      width: 100%;
      height: 100%;

      padding: 40px;

      background: rgba(250, 247, 241, 0.94);

      border: 1px solid rgba(120, 90, 60, 0.12);

      border-radius: 20px;

      box-shadow:
        0 20px 45px rgba(91, 68, 48, 0.13),
        0 4px 10px rgba(91, 68, 48, 0.07);

      display: flex;
      justify-content: center;
      align-items: center;

      backface-visibility: hidden;
    }


    .card-front {
      color: #725b48;

      font-size: 20px;

      line-height: 1.9;

      letter-spacing: 1px;
    }


    .card-back {
      transform: rotateY(180deg);

      color: #725b48;

      font-size: 18px;

      line-height: 2;

      letter-spacing: 1px;
    }


    .card-back::before {
      content: "✦";

      position: absolute;

      top: 25px;

      color: #b29c85;

      font-size: 13px;
    }


    .hint {
      margin-top: 18px;

      color: #927d68;

      font-size: 12px;

      letter-spacing: 2px;

      opacity: 0.7;
    }


    /* ===== 时间记录 ===== */

    .time-card {

      margin-top: 65px;

      padding: 35px 25px;

      background: rgba(250, 247, 241, 0.72);

      border: 1px solid rgba(120, 90, 60, 0.10);

      border-radius: 18px;
    }


    .time-title {

      color: #806b57;

      font-size: 14px;

      letter-spacing: 3px;
    }


    .days {

      margin-top: 12px;

      color: #5c4636;

      font-size: 38px;

      font-weight: 400;
    }


    .days span {

      font-size: 16px;

      margin-left: 5px;

      color: #927d68;
    }


    .time-subtitle {

      margin-top: 8px;

      color: #927d68;

      font-size: 13px;
    }


    /* ===== 成长记录 ===== */

    .records {

      margin-top: 55px;

      text-align: left;
    }


    .records-title {

      text-align: center;

      color: #5c4636;

      font-size: 22px;

      letter-spacing: 5px;

      margin-bottom: 25px;
    }


    .record {

      position: relative;

      margin-bottom: 15px;

      padding: 20px 22px;

      background: rgba(250, 247, 241, 0.82);

      border-radius: 14px;

      border: 1px solid rgba(120, 90, 60, 0.08);

      box-shadow:
        0 8px 20px rgba(91, 68, 48, 0.06);
    }


    .record-date {

      color: #a08b76;

      font-size: 12px;

      letter-spacing: 2px;

      margin-bottom: 8px;
    }


    .record-text {

      color: #725b48;

      font-size: 15px;

      line-height: 1.8;
    }


    /* ===== 添加按钮 ===== */

    .add-button {

      display: block;

      margin: 25px auto 0;

      padding: 10px 24px;

      border: 1px solid #b8a38c;

      border-radius: 30px;

      background: transparent;

      color: #806b57;

      font-size: 13px;

      cursor: pointer;

      transition: all 0.25s ease;
    }


    .add-button:hover {

      background: #806b57;

      color: #f8f4ed;
    }


    /* ===== 手机适配 ===== */

    @media (max-width: 600px) {

      .container {
        padding: 55px 0;
      }

      h1 {
        font-size: 36px;
        letter-spacing: 7px;
      }

      .card {
        height: 220px;
      }

      .card-front,
      .card-back {
        padding: 28px;
      }

      .days {
        font-size: 34px;
      }

    }

  </style>
</head>


<body>

  <main class="container">


    <!-- 叶子 -->

    <div class="leaf">

      <svg viewBox="0 0 50 50">

        <path d="
          M25 40
          C24 29, 17 20, 8 17
          C9 27, 15 36, 25 40
        " />

        <path d="
          M25 40
          C26 29, 33 20, 42 17
          C41 27, 35 36, 25 40
        " />

        <path d="
          M25 40
          C25 31, 25 23, 25 14
        " />

      </svg>

    </div>


    <h1>纪念日</h1>


    <div class="date">
      2026 · 10 · 02
    </div>


    <!-- ===== 第一张卡片 ===== -->

    <div class="card" id="card">

      <div class="card-inner">

        <div class="card-front" id="memorial"></div>

        <div class="card-back">

          第一次做网站的这一天，<br>
          也值得被好好记住。<br>
          愿你以后回头看时，<br>
          还记得自己是从这里开始的。

        </div>

      </div>

    </div>


    <div class="hint">
      点击卡片看看
    </div>


    <!-- ===== 已经走过多少天 ===== -->

    <section class="time-card">

      <div class="time-title">
        从这一天开始
      </div>

      <div class="days">

        <span id="daysNumber">0</span>

        <span>天</span>

      </div>

      <div class="time-subtitle">
        我已经做网站走了这么远
      </div>

    </section>


    <!-- ===== 成长记录 ===== -->

    <section class="records">

      <div class="records-title">
        成长记录
      </div>


      <div id="recordList"></div>


      <button class="add-button" onclick="addRecord()">
        ＋ 记录一个新的日子
      </button>

    </section>


  </main>


  <script>

    /* =================================
       第一次做网站的日期
    ================================= */

    var startDate = new Date(2026, 9, 2);


    /* =================================
       今天
    ================================= */

    var today = new Date();


    /*
      把时间归零，只比较日期
    */

    var start = new Date(
      startDate.getFullYear(),
      startDate.getMonth(),
      startDate.getDate()
    );

    var now = new Date(
      today.getFullYear(),
      today.getMonth(),
      today.getDate()
    );


    /* =================================
       计算过去了多少天
    ================================= */

    var diffTime = now - start;

    var diffDays = Math.floor(
      diffTime / (1000 * 60 * 60 * 24)
    );


    if (diffDays < 0) {
      diffDays = 0;
    }


    document.getElementById("daysNumber").innerText =
      diffDays;


    /* =================================
       第一张卡片的文字
    ================================= */

    var message = "";

    if (diffDays === 0) {

      message =
        "今天是第一次做网站的日子 🎉";

    } else {

      message =
        "第一次做网站，已经过去了 "
        + diffDays
        + " 天";

    }


    document.getElementById("memorial").innerText =
      message;


    /* =================================
       卡片翻面
    ================================= */

    var card = document.getElementById("card");

    card.addEventListener("click", function () {

      card.classList.toggle("flipped");

    });


    /* =================================
       成长记录
       
       localStorage 会把记录保存
       在这个浏览器里
    ================================= */

    var records =
      JSON.parse(
        localStorage.getItem("websiteRecords")
      ) || [];


    /* =================================
       显示记录
    ================================= */

    function showRecords() {

      var list =
        document.getElementById("recordList");

      list.innerHTML = "";


      records.forEach(function(record) {

        var div =
          document.createElement("div");

        div.className = "record";


        div.innerHTML =

          '<div class="record-date">'
          + record.date +
          '</div>'

          +

          '<div class="record-text">'
          + record.text +
          '</div>';


        list.appendChild(div);

      });

    }


    /* =================================
       添加新的成长记录
    ================================= */

    function addRecord() {

      var text =
        prompt(
          "今天做了什么？\n\n例如：第一次学会用 JavaScript 做互动。"
        );


      if (!text) {
        return;
      }


      var todayText =
        today.getFullYear()
        + " · "
        + String(today.getMonth() + 1).padStart(2, "0")
        + " · "
        + String(today.getDate()).padStart(2, "0");


      records.push({

        date: todayText,

        text: text

      });


      /* 保存 */

      localStorage.setItem(
        "websiteRecords",
        JSON.stringify(records)
      );


      /* 重新显示 */

      showRecords();

    }


    /* 第一次打开时显示记录 */

    showRecords();

  </script>

</body>

</html>
